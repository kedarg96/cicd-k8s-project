<svg viewBox="0 0 920 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="920" height="580" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">CI/CD Pipeline on AWS: GitHub, Jenkins, Docker, Kubernetes, Ansible</text>

  <!-- AWS VPC -->
  <rect x="520" y="50" width="380" height="500" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="74" font-size="13" font-weight="bold" fill="#c2410c">AWS VPC (3 x EC2, Ubuntu LTS)</text>

  <!-- Developer -->
  <rect x="30" y="80" width="190" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="125" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">Developer laptop</text>
  <text x="125" y="130" text-anchor="middle" font-size="12" fill="#075985">Windows + WSL Ubuntu</text>
  <text x="125" y="148" text-anchor="middle" font-size="12" fill="#075985">Git, Ansible</text>
  <text x="125" y="166" text-anchor="middle" font-size="12" fill="#075985">(control node)</text>

  <!-- GitHub -->
  <rect x="300" y="80" width="170" height="100" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="385" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">GitHub</text>
  <text x="385" y="136" text-anchor="middle" font-size="12" fill="#374151">Source code,</text>
  <text x="385" y="152" text-anchor="middle" font-size="12" fill="#374151">Jenkinsfile,</text>
  <text x="385" y="168" text-anchor="middle" font-size="12" fill="#374151">k8s manifests</text>

  <!-- Jenkins -->
  <rect x="550" y="95" width="320" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="710" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Jenkins server (EC2)</text>
  <text x="710" y="143" text-anchor="middle" font-size="12" fill="#991b1b">Polls GitHub every ~2 min (Poll SCM)</text>
  <text x="710" y="161" text-anchor="middle" font-size="12" fill="#991b1b">1. Maven build and test</text>
  <text x="710" y="177" text-anchor="middle" font-size="12" fill="#991b1b">2. Docker build  3. Push image</text>
  <text x="710" y="193" text-anchor="middle" font-size="12" fill="#991b1b">4. kubectl apply and rollout status</text>

  <!-- K8s master -->
  <rect x="550" y="250" width="320" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Kubernetes control plane (EC2)</text>
  <text x="710" y="298" text-anchor="middle" font-size="12" fill="#166534">kubeadm, containerd, flannel CNI</text>
  <text x="710" y="316" text-anchor="middle" font-size="12" fill="#166534">API server, etcd, scheduler</text>

  <!-- K8s worker -->
  <rect x="550" y="390" width="320" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="417" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Kubernetes worker (EC2)</text>
  <rect x="580" y="432" width="120" height="44" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="640" y="459" text-anchor="middle" font-size="12" fill="#166534">myapp pod 1</text>
  <rect x="720" y="432" width="120" height="44" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="780" y="459" text-anchor="middle" font-size="12" fill="#166534">myapp pod 2</text>
  <text x="710" y="500" text-anchor="middle" font-size="12" fill="#166534">Service: NodePort 30080</text>

  <!-- Docker Hub -->
  <rect x="300" y="290" width="170" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="385" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Docker Hub</text>
  <text x="385" y="342" text-anchor="middle" font-size="12" fill="#1e40af">myapp:BUILD_NUMBER</text>
  <text x="385" y="360" text-anchor="middle" font-size="12" fill="#1e40af">(public repository)</text>

  <!-- Browser -->
  <rect x="300" y="430" width="170" height="70" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="385" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">User browser</text>
  <text x="385" y="480" text-anchor="middle" font-size="12" fill="#374151">http://worker-ip:30080</text>

  <!-- Arrows -->
  <line x1="220" y1="130" x2="298" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="259" y="120" text-anchor="middle" font-size="11" fill="#374151">git push</text>

  <line x1="548" y1="150" x2="472" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="140" text-anchor="middle" font-size="11" fill="#374151">poll</text>

  <line x1="560" y1="205" x2="440" y2="288" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="236" font-size="11" fill="#374151">push image</text>

  <line x1="710" y1="205" x2="710" y2="248" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="720" y="232" font-size="11" fill="#374151">kubectl apply</text>

  <line x1="710" y1="345" x2="710" y2="388" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="720" y="372" font-size="11" fill="#374151">schedules pods</text>

  <line x1="548" y1="410" x2="440" y2="382" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="456" y="415" font-size="11" fill="#374151">pull image</text>

  <line x1="472" y1="470" x2="548" y2="470" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="462" text-anchor="middle" font-size="11" fill="#374151">HTTP</text>

  <!-- Ansible dashed -->
  <path d="M 125 180 L 125 545 L 518 545" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrd)"/>
  <text x="140" y="565" font-size="12" fill="#6d28d9">Ansible over SSH: installs Jenkins and Docker, builds the kubeadm cluster</text>
</svg>
